name: Deploy
on:
  workflow_run:
    # Note: This will only trigger if the workflow file is on the default branch
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  id-token: write # OIDC token for AWS

# One deploy per branch at a time. Each redeploy boots a new server against the same database and
# only terminates the old one once the new one is ready, so overlapping deploys (e.g. a burst of
# merges to dev) multiply connections and can exhaust max_connections. Don’t cancel in progress:
# that would orphan a half-built server. Queued runs are superseded by newer ones.
concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # Only run if Tupaia CI passed
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v5
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-southeast-2
          role-to-assume: arn:aws:iam::843218180240:role/Tupaia_GHA
          role-session-name: GHA@Tupaia
      - run: CI_BRANCH=${{ github.event.workflow_run.head_branch }} CI_COMMITTER_NAME=${{ github.event.workflow_run.actor.name }} CI_BUILD_ID=$GITHUB_RUN_ID packages/devops/scripts/ci/triggerRedeploy.sh
