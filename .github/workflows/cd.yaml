name: Deploy
on:
  workflow_run:
    # Note: This will only trigger if the workflow file is on the default branch
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  id-token: write # OIDC token for AWS

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # Only run if Tupaia CI passed
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    # One deploy per branch at a time. Each redeploy boots a new server against the same database
    # and only terminates the old one once the new one is ready, so overlapping deploys (e.g. a
    # burst of merges to dev) multiply connections and can exhaust max_connections. Don’t cancel in
    # progress: that would orphan a half-built server. A queued deploy is superseded by a newer one,
    # so runs for CI that didn’t pass get a group of their own and can never displace a good deploy.
    concurrency:
      group: deploy-${{ github.event.workflow_run.head_branch }}${{ github.event.workflow_run.conclusion != 'success' && format('-skip-{0}', github.run_id) || '' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ap-southeast-2
          role-to-assume: arn:aws:iam::843218180240:role/Tupaia_GHA
          role-session-name: GHA@Tupaia
      - run: CI_BRANCH=${{ github.event.workflow_run.head_branch }} CI_COMMITTER_NAME=${{ github.event.workflow_run.actor.name }} CI_BUILD_ID=$GITHUB_RUN_ID packages/devops/scripts/ci/triggerRedeploy.sh
